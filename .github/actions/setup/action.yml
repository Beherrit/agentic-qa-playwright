name: Setup
description: Installs Node and the project's dependencies, and Chromium for Playwright unless told not to.

inputs:
  browser:
    description: Set to 'false' in jobs that never open a browser. It saves about a minute.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: npm

    - run: npm ci
      shell: bash

    - if: inputs.browser == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    # Runs on a cache hit too. The browser download is skipped then, but the system
    # libraries Chromium needs are not part of the cache and still have to be installed.
    - if: inputs.browser == 'true'
      run: npx playwright install --with-deps chromium
      shell: bash
