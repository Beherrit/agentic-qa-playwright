name: Regression

# Runs the whole suite. When tests fail, an agent works out what the failures mean and,
# outside pull requests, the bugs it finds are filed as issues.

# Another repository runs this same workflow with `uses:` (see qa-analysis.yml).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      persona:
        description: Sign in as this account (the suite's default when empty). The demo shop's problem_user and error_user are broken on purpose, which is a quick way to see triage work.
        type: string
        default: ''
  workflow_call:
    inputs:
      persona:
        description: Sign in as this account, for a manual run of the caller
        type: string
        default: ''

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      # Triage is for failed tests, not for a type or lint error.
      tests: ${{ steps.tests.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1

      # The project's own typecheck and lint commands, from qa.config.json.
      - run: npx agentic-qa check

      # Runtime dependencies with a known high or critical vulnerability stop the run. Dev dependencies are
      # reported by Dependabot instead, since they never reach a host project.
      - run: npm audit --omit=dev --audit-level=high

      # The engine's own rules: gates, plan score, tracker adapters, reports. Only where the engine's code is.
      - if: hashFiles('agents/test/*.test.ts') != ''
        run: npm run test:unit

      # The engine as a host project sees it: packed, installed into an empty project, set up, and used.
      - if: hashFiles('agents/test/install.sh') != ''
        run: bash agents/test/install.sh

      # The configured test command, signed in first when the project needs it. QA_PERSONA reaches the
      # suite under the variable it reads (personas.envVar); empty means the suite's default account.
      - name: Run the tests
        id: tests
        env:
          QA_PERSONA: ${{ inputs.persona }}
        run: npx agentic-qa suite

      # On the run's summary page: each requirement, the criteria its tests claim, and how they did.
      - name: Traceability map
        if: ${{ !cancelled() && hashFiles('test-results/results.json') != '' }}
        run: npx agentic-qa coverage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      # The triage job reads results.json and the failure evidence from here.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  triage:
    name: Triage failures
    needs: test
    # Pull requests from forks get no secrets, so there is nothing to run the agent with.
    if: >-
      ${{ failure() && needs.test.result == 'failure' && needs.test.outputs.tests == 'failure'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment: POC
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      bugs: ${{ steps.triage.outputs.bugs }}
      defects: ${{ steps.triage.outputs.defects }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1
        with:
          browser: 'false'

      # results.json refers to its evidence files by absolute path. They resolve here
      # because both jobs check the repository out in the same place on the runner.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-results
          path: test-results

      - name: Check that Claude credentials are configured
        id: auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QA_PROVIDER_ENV: ${{ secrets.QA_PROVIDER_ENV }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$QA_PROVIDER_ENV" ]; then
            echo "::notice title=Triage skipped::No Claude credentials are configured. Add the secret CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY to the POC environment to have failures triaged."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Triage
        id: triage
        if: steps.auth.outputs.available == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QA_AGENT_MODEL: ${{ vars.QA_AGENT_MODEL }}
          QA_PROVIDER_ENV: ${{ secrets.QA_PROVIDER_ENV }}
          QA_PERSONA: ${{ inputs.persona }}
        run: npx agentic-qa triage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.auth.outputs.available == 'true'
        with:
          name: triage
          path: qa-run/
          if-no-files-found: ignore
          retention-days: 14

  # Self-healing. When triage says a failure is the test's fault, an agent repairs the test, gates
  # check that nothing was weakened, and the repair is offered as a pull request. Product bugs are
  # never "healed": those go to file-bugs below and the tests keep failing until the app is fixed.
  heal:
    name: Heal test defects
    needs: triage
    if: >-
      ${{ !cancelled() && needs.triage.result == 'success' && github.event_name != 'pull_request'
      && needs.triage.outputs.defects != '' && needs.triage.outputs.defects != '0' }}
    runs-on: ubuntu-latest
    environment: POC
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      healed: ${{ steps.heal.outputs.healed }}
      title: ${{ steps.heal.outputs.title }}
      writable: ${{ steps.heal.outputs.writable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-results
          path: test-results

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: triage
          path: qa-run

      - name: Repair the tests and run the gates
        id: heal
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QA_AGENT_MODEL: ${{ vars.QA_AGENT_MODEL }}
          QA_PROVIDER_ENV: ${{ secrets.QA_PROVIDER_ENV }}
          QA_PERSONA: ${{ inputs.persona }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npx agentic-qa heal

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: heal
          path: qa-run/
          if-no-files-found: ignore
          retention-days: 14

  # No agent and no Claude credentials here. It applies the repair, refusing any path outside the
  # test folders, pushes a branch and opens the pull request against the branch that failed.
  heal-pr:
    name: Open the repair
    needs: heal
    if: ${{ !cancelled() && needs.heal.outputs.healed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1
        with:
          browser: 'false'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: heal
          path: qa-run

      - name: Apply the repair
        run: npx agentic-qa apply heal.patch

      - name: Push the branch and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.heal.outputs.title }}
          WRITABLE: ${{ needs.heal.outputs.writable }}
          BRANCH: qa/heal-${{ github.run_id }}
          BASE: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # shellcheck disable=SC2086
          git add -- $WRITABLE
          if git diff --cached --quiet; then
            echo "::error::The repair is empty. Nothing to open a pull request for."
            exit 1
          fi
          git commit -m "$TITLE"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          gh pr create --title "$TITLE" --body-file qa-run/heal.md --base "$BASE" --head "$BRANCH"

  file-bugs:
    name: File bugs
    needs: triage
    # The failed test job is an ancestor of this one, so the default "everything before
    # me succeeded" check would always skip it. Hence the explicit conditions.
    if: >-
      ${{ !cancelled() && needs.triage.result == 'success' && github.event_name != 'pull_request'
      && needs.triage.outputs.bugs != '' && needs.triage.outputs.bugs != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: triage
          path: qa-run

      # Each bug carries one fingerprint per test it breaks. An open issue that shares any of
      # them gets a comment instead of a duplicate, so a bug that starts breaking one more
      # test is still recognised.
      # gh is called without a shell in between, so a title is only ever an argument.
      - name: File new bugs, update known ones
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node <<'EOF'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');

          const gh = (...args) => execFileSync('gh', args, { encoding: 'utf8' });
          const runUrl = process.env.RUN_URL;
          const { bugs } = JSON.parse(fs.readFileSync('qa-run/triage.json', 'utf8'));

          const known = (fingerprint) =>
            JSON.parse(gh('issue', 'list', '--state', 'open', '--search', `${fingerprint} in:body`, '--json', 'number'))[0];

          for (const bug of bugs) {
            const match = bug.fingerprints.map(known).find(Boolean);
            if (match) {
              gh('issue', 'comment', String(match.number), '--body', `Still failing in run ${runUrl}`);
              console.log(`Known bug, commented on #${match.number}: ${bug.title}`);
              continue;
            }
            const file = path.join(process.env.RUNNER_TEMP, `bug-${bug.fingerprints[0]}.md`);
            fs.writeFileSync(
              file,
              `${bug.body}\n\nFound by regression run ${runUrl}\n\nFingerprints: ${bug.fingerprints.join(' ')}\n`,
            );
            const url = gh('issue', 'create', '--title', `[bug] ${bug.title}`, '--label', 'bug', '--body-file', file);
            console.log(`Filed ${url.trim()}: ${bug.title}`);
          }
          EOF
