name: QA analysis

# A requirement in, a QA analysis out, posted back on the ticket within minutes: user story, acceptance
# criteria, risk, open questions, a technical review and a scored test plan. No test code is written here; that is
# qa-tests.yml, started by a second label once a person has read this.
#
# Five ways in:
# - a GitHub issue gets the `qa-pipeline` label
# - a member answers the pipeline's questions on a blocked issue, in a comment starting with `/qa-answer`
# - a pull request from this repository gets the `qa-pipeline` label: the change itself is the requirement
# - a Jira ticket gets the `qa-pipeline` label, and a Jira Automation rule sends a repository_dispatch
#   event `qa-analyze` with {"source": "jira", "ref": "<KEY>"} (the README has the rule)
# - a manual run, naming the source and the ticket
#
# Only people with triage rights can label a GitHub issue or pull request, and only holders of a token
# with write access can send repository_dispatch, so a stranger's text never reaches an agent on its own.
#
# Another repository runs this same workflow with `uses: Beherrit/agentic-qa-playwright/.github/workflows/
# qa-analysis.yml@v1` (`npx agentic-qa init` writes the caller). `v1` follows the latest 1.x release. The engine is then a dependency of that
# repository, and `npx agentic-qa` finds it there; in this repository it finds the engine's own bin.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  # Every new comment on every issue and pull request starts this and is skipped at once unless all four hold: it
  # is an issue, the comment starts with /qa-answer, the author belongs to the repository, and the issue is
  # waiting for answers (qa-needs-info). The intake checks the author again before reading any answer.
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [qa-analyze]
  workflow_dispatch:
    inputs:
      source:
        description: Where the requirement lives
        type: choice
        options: [github, jira, pr]
        default: github
      ref:
        description: Issue or pull request number (github, pr) or ticket key (jira)
        required: true
        type: string
  workflow_call:
    inputs:
      source:
        description: Where the requirement lives, for a manual run of the caller
        type: string
        default: ''
      ref:
        description: The ticket, for a manual run of the caller
        type: string
        default: ''
      tests_workflow:
        description: The caller's file name for the test half, which a good plan starts
        type: string
        default: qa-tests.yml

# One run per ticket: labelling it again replaces the run in progress. Other labels on a GitHub
# issue or pull request also start this workflow (and are then skipped); they get a group of their own.
concurrency:
  group: >-
    ${{ ((github.event_name != 'issues' && github.event_name != 'pull_request' && github.event_name != 'issue_comment')
    || github.event.label.name == 'qa-pipeline'
    || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
    && startsWith(github.event.comment.body, '/qa-answer')
    && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    && contains(github.event.issue.labels.*.name, 'qa-needs-info')))
    && format('qa-analysis-{0}', github.event.issue.number || github.event.pull_request.number || github.event.client_payload.ref || inputs.ref)
    || format('qa-ignored-{0}', github.run_id) }}
  cancel-in-progress: true

permissions: {}

# Values from issues and payloads reach scripts as environment variables, never by ${{ }} inside a
# script, and the intake stage checks the reference before using it.
env:
  SOURCE: ${{ (github.event_name == 'issues' || github.event_name == 'issue_comment') && 'github' || github.event_name == 'pull_request' && 'pr' || github.event.client_payload.source || inputs.source }}
  REF: ${{ github.event.issue.number || github.event.pull_request.number || github.event.client_payload.ref || inputs.ref }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

# Credentials, kept apart:
# - The tracker credentials (Jira, and the GitHub token for issues) live on the `TRACKER` environment
#   and are only given to the two jobs that read or write the ticket. No agent runs in those jobs.
# - The Claude credentials live on the `POC` environment and are only given to the agent steps.
#   Those jobs check out with persist-credentials: false and never get a tracker token.

jobs:
  intake:
    name: 0 Read the ticket
    # A pull request from a fork is read only when a person with triage rights labels it, like an issue, but
    # its head is still someone else's code: the analysis reads it as text and never checks it out.
    if: >-
      ${{ (github.event_name != 'issues' && github.event_name != 'pull_request' && github.event_name != 'issue_comment')
      || (github.event.label.name == 'qa-pipeline'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
      || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/qa-answer')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      && contains(github.event.issue.labels.*.name, 'qa-needs-info')) }}
    runs-on: ubuntu-latest
    environment: TRACKER
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      artifact: ${{ steps.intake.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1
        with:
          browser: 'false'

      - name: Read the requirement
        id: intake
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: npx agentic-qa intake --source "$SOURCE" --ref "$REF"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-run
          path: qa-run/
          overwrite: true

  requirements:
    name: 1 Requirements
    needs: intake
    runs-on: ubuntu-latest
    environment: POC
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.stage.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that Claude credentials are configured
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QA_PROVIDER_ENV: ${{ secrets.QA_PROVIDER_ENV }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$QA_PROVIDER_ENV" ]; then
            echo "::error title=No Claude credentials::Add the secret CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY (or QA_PROVIDER_ENV for Bedrock or Vertex) to the POC environment under Settings > Environments."
            exit 1
          fi

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1
        with:
          browser: 'false'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-run
          path: qa-run

      - name: Analyse the requirement
        id: stage
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QA_AGENT_MODEL: ${{ vars.QA_AGENT_MODEL }}
          QA_PROVIDER_ENV: ${{ secrets.QA_PROVIDER_ENV }}
        run: npx agentic-qa requirements

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-run
          path: qa-run/
          overwrite: true

  # Every ticket gets technical notes, hand-written ones included. A ticket from the ticket writer
  # already has them: they are read back and checked, and no agent runs. Otherwise a read-only
  # reviewer with a browser writes them, and the same checks decide what is kept.
  technical:
    name: 1b Technical review
    needs: requirements
    if: needs.requirements.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: POC
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-run
          path: qa-run

      - name: Review the requirement against the code and the app
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QA_AGENT_MODEL: ${{ vars.QA_AGENT_MODEL }}
          QA_PROVIDER_ENV: ${{ secrets.QA_PROVIDER_ENV }}
        run: npx agentic-qa technical

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-run
          path: qa-run/
          overwrite: true

  # 2a and 2b run side by side and do not see each other's work. Each uploads only the file it
  # produced, so neither can overwrite the shared qa-run artifact under the other.
  plan:
    name: '2a Strategy: architect'
    needs: [requirements, technical]
    if: needs.requirements.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: POC
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-run
          path: qa-run

      - name: Write the test plan
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QA_AGENT_MODEL: ${{ vars.QA_AGENT_MODEL }}
          QA_PROVIDER_ENV: ${{ secrets.QA_PROVIDER_ENV }}
        run: npx agentic-qa plan

      # Both parallel jobs append to qa-run/ledger.json. Each sends its copy under its own name and
      # the reconcile job puts them back together.
      - name: Keep this job's cost ledger
        run: cp qa-run/ledger.json qa-run/ledger-plan.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-plan
          path: |
            qa-run/plan.json
            qa-run/ledger-plan.json
          if-no-files-found: error
          overwrite: true

  critic:
    name: '2b Strategy: critic'
    needs: [requirements, technical]
    if: needs.requirements.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: POC
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1
        with:
          browser: 'false'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-run
          path: qa-run

      - name: Write the checklist
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QA_AGENT_MODEL: ${{ vars.QA_AGENT_MODEL }}
          QA_PROVIDER_ENV: ${{ secrets.QA_PROVIDER_ENV }}
        run: npx agentic-qa critic

      - name: Keep this job's cost ledger
        run: cp qa-run/ledger.json qa-run/ledger-critic.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-critic
          path: |
            qa-run/checklist.json
            qa-run/ledger-critic.json
          if-no-files-found: error
          overwrite: true

  reconcile:
    name: '2c Strategy: reconcile'
    needs: [plan, critic]
    runs-on: ubuntu-latest
    environment: POC
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1
        with:
          browser: 'false'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-run
          path: qa-run

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-plan
          path: qa-run

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-critic
          path: qa-run

      # ledger.json from the qa-run artifact is what both parallel jobs started with. Whatever each
      # of them holds beyond that length is what it added.
      - name: Merge the cost ledgers
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const read = (file) => (fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : []);
          const base = read('qa-run/ledger.json');
          const merged = [...base];
          for (const file of ['qa-run/ledger-plan.json', 'qa-run/ledger-critic.json']) {
            merged.push(...read(file).slice(base.length));
            fs.rmSync(file, { force: true });
          }
          fs.writeFileSync('qa-run/ledger.json', `${JSON.stringify(merged, null, 2)}\n`);
          EOF

      - name: Reconcile the plan with the checklist
        id: stage
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QA_AGENT_MODEL: ${{ vars.QA_AGENT_MODEL }}
          QA_PROVIDER_ENV: ${{ secrets.QA_PROVIDER_ENV }}
        run: npx agentic-qa reconcile

      # The stage exits 1 when the plan scores too low. The strategy is still worth keeping and
      # reporting then, because it says why.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.stage.outcome != 'skipped'
        with:
          name: qa-run
          path: qa-run/
          overwrite: true

  # Runs however the analysis ended (ready, blocked by questions, low score, or failed) and says so
  # on the ticket. It also keeps the analysis under a name per ticket for qa-tests.yml to pick up.
  report:
    name: 3 Report on the ticket
    needs: [intake, requirements, technical, plan, critic, reconcile]
    if: ${{ !cancelled() && needs.intake.result == 'success' }}
    runs-on: ubuntu-latest
    environment: TRACKER
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      # To start the test half when the plan is good (autoRun.testsWhenPlanIsReady in qa.config.json).
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1
        with:
          browser: 'false'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-run
          path: qa-run

      - name: Post the analysis
        id: notify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: npx agentic-qa notify analysis

      # Uploaded before the test half is started, because that is what it picks up.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.intake.outputs.artifact }}
          path: qa-run/
          overwrite: true

      # A label added with the workflow's own token would not start a workflow, but a dispatch does.
      - name: Start the test half
        if: steps.notify.outputs.autorun == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TESTS_WORKFLOW: ${{ inputs.tests_workflow || 'qa-tests.yml' }}
        run: gh workflow run "$TESTS_WORKFLOW" --ref "$DEFAULT_BRANCH" -f "source=$SOURCE" -f "ref=$REF"
