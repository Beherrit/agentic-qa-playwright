name: Compatibility

# The engine is installed into other people's projects, on their machines and their Playwright. This proves the claim
# on a grid instead of on the one setup the maintainer happens to have: the unit tests, typecheck and lint on every
# OS and supported Node, and the packed-install test (init, doctor, a suite, the checks, the MCP server) on the
# oldest Playwright the package says it supports and on the newest.

on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - 'agents/**'
      - 'bin/**'
      - 'templates/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/compat.yml'

permissions: {}

jobs:
  engine:
    name: Engine on ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # engines.node in package.json is >=22.18: the first Node that runs TypeScript tests without a flag.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit

  host:
    name: Host with Playwright ${{ matrix.playwright }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The oldest version peerDependencies allows, and whatever is current.
        playwright: ['1.50.0', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash agents/test/install.sh
        env:
          PLAYWRIGHT_VERSION: ${{ matrix.playwright }}
