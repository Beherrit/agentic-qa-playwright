name: QA tests

# The second half. Once a person has read the analysis on the ticket, the `qa-generate` label (or a
# repository_dispatch event `qa-generate` from Jira) has the tests written, gated, reviewed and opened
# as a pull request. It works from the latest analysis of that ticket, so run QA analysis first.
#
# The ticket is read again here, because whether the feature is built may have changed since the
# analysis: a story analysed before development can get its tests written test-first, or after.

# Another repository runs this same workflow with `uses:` (see qa-analysis.yml).

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  repository_dispatch:
    types: [qa-generate]
  workflow_dispatch:
    inputs:
      source:
        description: Where the requirement lives
        type: choice
        options: [github, jira, pr]
        default: github
      ref:
        description: Issue or pull request number (github, pr) or ticket key (jira)
        required: true
        type: string
  workflow_call:
    inputs:
      source:
        description: Where the requirement lives, for a manual run of the caller
        type: string
        default: ''
      ref:
        description: The ticket, for a manual run of the caller
        type: string
        default: ''
      analysis_workflow:
        description: The caller's path for the analysis half, whose artifact this picks up
        type: string
        default: .github/workflows/qa-analysis.yml

concurrency:
  group: >-
    ${{ ((github.event_name != 'issues' && github.event_name != 'pull_request') || github.event.label.name == 'qa-generate')
    && format('qa-tests-{0}', github.event.issue.number || github.event.pull_request.number || github.event.client_payload.ref || inputs.ref)
    || format('qa-ignored-{0}', github.run_id) }}
  cancel-in-progress: true

permissions: {}

env:
  SOURCE: ${{ github.event_name == 'issues' && 'github' || github.event_name == 'pull_request' && 'pr' || github.event.client_payload.source || inputs.source }}
  REF: ${{ github.event.issue.number || github.event.pull_request.number || github.event.client_payload.ref || inputs.ref }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  prepare:
    name: 0 Ticket and analysis
    if: >-
      ${{ (github.event_name != 'issues' && github.event_name != 'pull_request')
      || (github.event.label.name == 'qa-generate'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    environment: TRACKER
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1
        with:
          browser: 'false'

      - name: Read the ticket again
        id: intake
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          npx agentic-qa intake --source "$SOURCE" --ref "$REF"
          cp qa-run/request.json "$RUNNER_TEMP/request.json"

      # Kept even if a later step fails, so the report job can tell the ticket why.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-run
          path: qa-run/
          overwrite: true

      # Any workflow run can upload an artifact with any name, including one started by a pull request
      # from a fork. So the analysis is only taken from a run of qa-analysis.yml in this repository, on
      # the default branch, started by a label, a dispatch or a person.
      - name: Find the latest analysis of this ticket
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.intake.outputs.artifact }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ANALYSIS_WORKFLOW: ${{ inputs.analysis_workflow || '.github/workflows/qa-analysis.yml' }}
        run: |
          candidates=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT&per_page=50" --jq '
            [.artifacts[]
              | select((.expired | not)
                and .workflow_run.head_repository_id == .workflow_run.repository_id
                and .workflow_run.head_branch == env.DEFAULT_BRANCH)]
            | sort_by(.created_at) | reverse | .[].workflow_run.id')
          run_id=""
          for id in $candidates; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '[.path, .event] | join(" ")')
            case "$run" in
              "$ANALYSIS_WORKFLOW issues" | \
              "$ANALYSIS_WORKFLOW issue_comment" | \
              "$ANALYSIS_WORKFLOW pull_request" | \
              "$ANALYSIS_WORKFLOW repository_dispatch" | \
              "$ANALYSIS_WORKFLOW workflow_dispatch")
                run_id=$id
                break ;;
            esac
          done
          if [ -z "$run_id" ]; then
            echo "::error title=No analysis::This ticket has no analysis yet. Add the qa-pipeline label first, read the analysis, then add qa-generate."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.intake.outputs.artifact }}
          path: qa-run
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}

      # The analysis is kept as it was; only the ticket itself (title, body, mode) is refreshed.
      - name: Check the plan is good enough to write tests from
        run: |
          cp "$RUNNER_TEMP/request.json" qa-run/request.json
          npx agentic-qa check-plan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-run
          path: qa-run/
          overwrite: true

  # The engineer writes, with the credentials. The gates run in a later job, which has none: the whole
  # suite, the stability runs, the known-broken targets, the saboteur's faults and the accessibility scan all execute generated
  # test code, and that code never sees a model token. The saboteur between them runs no test. The engineer still runs the tests it writes as it
  # goes, so the token is exposed to generated code for that long; see SECURITY.md.
  write:
    name: 1 Code generation
    needs: prepare
    runs-on: ubuntu-latest
    environment: POC
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-run
          path: qa-run

      - name: Write the tests
        id: stage
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QA_AGENT_MODEL: ${{ vars.QA_AGENT_MODEL }}
          QA_PROVIDER_ENV: ${{ secrets.QA_PROVIDER_ENV }}
        run: npx agentic-qa write

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.stage.outcome != 'skipped'
        with:
          name: qa-run
          path: qa-run/
          overwrite: true

  # The saboteur breaks the feature on purpose, one criterion at a time, and writes each break as a file in
  # qa-run/faults/. It holds the credentials and runs no test: the gates job runs the new tests against the
  # faults, without credentials. It is read-only. If it fails, the gates still run and say there were no faults.
  sabotage:
    name: 1a Saboteur
    needs: write
    runs-on: ubuntu-latest
    environment: POC
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-run
          path: qa-run

      - name: Apply the generated change
        run: npx agentic-qa apply

      - name: Break the feature on purpose
        id: stage
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QA_AGENT_MODEL: ${{ vars.QA_AGENT_MODEL }}
          QA_PROVIDER_ENV: ${{ secrets.QA_PROVIDER_ENV }}
        run: npx agentic-qa sabotage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.stage.outcome != 'skipped'
        with:
          name: qa-run
          path: qa-run/
          overwrite: true

  gates:
    name: 1b Quality gates
    needs: [write, sabotage]
    # Without a status function here, a failed saboteur would skip the gates.
    if: ${{ !cancelled() && needs.write.result == 'success' }}
    runs-on: ubuntu-latest
    # The gates run the whole suite each time, plus the new tests against each known-broken target and each fault.
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      gates: ${{ steps.stage.outputs.gates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-run
          path: qa-run

      - name: Apply the generated change
        run: npx agentic-qa apply

      # Exits 0 whether the gates pass or fail; the `gates` output says which, and the fix job reads it.
      - name: Run the gates
        id: stage
        run: npx agentic-qa gates

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.stage.outcome != 'skipped'
        with:
          name: qa-run
          path: qa-run/
          overwrite: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.stage.outputs.gates != 'passed'
        with:
          name: gates-playwright-output
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # One fix round: the gate report goes back to the engineer once, and the gates run again.
  fix:
    name: 1c Fix round
    needs: gates
    if: needs.gates.outputs.gates == 'failed'
    runs-on: ubuntu-latest
    environment: POC
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-run
          path: qa-run

      - name: Apply the generated change
        run: npx agentic-qa apply

      - name: Fix what the gates found
        id: stage
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QA_AGENT_MODEL: ${{ vars.QA_AGENT_MODEL }}
          QA_PROVIDER_ENV: ${{ secrets.QA_PROVIDER_ENV }}
        run: npx agentic-qa fix

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.stage.outcome != 'skipped'
        with:
          name: qa-run
          path: qa-run/
          overwrite: true

  gates-again:
    name: 1d Quality gates again
    needs: fix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      gates: ${{ steps.stage.outputs.gates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-run
          path: qa-run

      - name: Apply the generated change
        run: npx agentic-qa apply

      - name: Run the gates
        id: stage
        run: npx agentic-qa gates

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.stage.outcome != 'skipped'
        with:
          name: qa-run
          path: qa-run/
          overwrite: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.stage.outputs.gates != 'passed'
        with:
          name: gates-playwright-output
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      # The tests failed the gates twice. The job turns red here, so the run says so.
      - if: steps.stage.outputs.gates != 'passed'
        run: |
          echo "::error title=Gates failed::The generated tests did not pass the quality gates after the fix round. See qa-run/gates.md in the artifact."
          exit 1

  review:
    name: 2 Code review
    needs: [gates, gates-again]
    # The gates passed first time (the fix round was skipped), or after the fix round.
    if: ${{ !cancelled() && (needs.gates.outputs.gates == 'passed' || needs.gates-again.outputs.gates == 'passed') }}
    runs-on: ubuntu-latest
    environment: POC
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.stage.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1
        with:
          browser: 'false'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-run
          path: qa-run

      - name: Apply the generated change
        run: npx agentic-qa apply

      - name: Review the change
        id: stage
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QA_AGENT_MODEL: ${{ vars.QA_AGENT_MODEL }}
          QA_PROVIDER_ENV: ${{ secrets.QA_PROVIDER_ENV }}
        run: npx agentic-qa review

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-run
          path: qa-run/
          overwrite: true

  # One round only: the engineer answers the findings, the gates run again, and the reviewer has a
  # second look. Whatever the second verdict is, a person decides next.
  rework:
    name: 2b Rework + re-review
    needs: review
    # A status function, or this job is skipped whenever the fix round before it was skipped: a job that
    # depends on a skipped job is skipped too, even through a job that ran.
    if: ${{ !cancelled() && needs.review.result == 'success' && needs.review.outputs.verdict == 'request-changes' }}
    runs-on: ubuntu-latest
    environment: POC
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-run
          path: qa-run

      - name: Apply the generated change
        run: npx agentic-qa apply

      - name: Rework and review again
        id: stage
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QA_AGENT_MODEL: ${{ vars.QA_AGENT_MODEL }}
          QA_PROVIDER_ENV: ${{ secrets.QA_PROVIDER_ENV }}
        run: npx agentic-qa rework

      # Uploaded on failure too, so the ticket gets the gate report of the reworked tests.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.stage.outcome != 'skipped'
        with:
          name: qa-run
          path: qa-run/
          overwrite: true

  # The only job that can write to the repository. No agent runs here and no Claude or tracker
  # credentials are present: it applies the patch, pushes a branch and opens the pull request.
  # The patch passed through jobs where generated test code ran, so nothing in it is executed here:
  # the description is written before it is applied, applying it refuses any path outside the
  # writable folders, and only git and gh run afterwards. The write token is not left in .git/config
  # and is handed to the push alone.
  publish:
    name: 3 Pull request
    needs: [review, rework]
    # Without a status function here, the skipped rework job would skip this job as well.
    if: ${{ !cancelled() && needs.review.result == 'success' && (needs.rework.result == 'success' || needs.rework.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      url: ${{ steps.pr.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The report stage runs through tsx, so the dependencies are needed. The browser is not.
      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1
        with:
          browser: 'false'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-run
          path: qa-run

      - name: Write the pull request description
        id: report
        run: npx agentic-qa report

      - name: Apply the generated change
        run: npx agentic-qa apply

      - name: Push the branch
        env:
          BRANCH: ${{ steps.report.outputs.branch }}
          TITLE: ${{ steps.report.outputs.title }}
          WRITABLE: ${{ steps.report.outputs.writable }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The branch is force-pushed, so make sure it is one of ours before going on.
          if ! printf '%s' "$BRANCH" | grep -Eq '^qa/[a-z][a-z0-9_]*-[0-9]+$'; then
            echo "::error::Unexpected branch name from the report stage: $BRANCH"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # The writable folders from qa.config.json, as the report stage listed them.
          # shellcheck disable=SC2086
          git add -- $WRITABLE
          if git diff --cached --quiet; then
            echo "::error::The generated change is empty. Nothing to open a pull request for."
            exit 1
          fi
          git commit -m "$TITLE"
          # A second run for the same ticket replaces the first one's branch.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

      - name: Open or update the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.report.outputs.branch }}
          TITLE: ${{ steps.report.outputs.title }}
          DRAFT: ${{ steps.report.outputs.draft }}
          # A requirement that arrived as a pull request gets its tests on that pull request's branch.
          BASE: ${{ steps.report.outputs.base || github.event.repository.default_branch }}
        run: |
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$TITLE" --body-file qa-run/pull-request.md
          else
            args=(--body-file qa-run/pull-request.md --base "$BASE" --head "$BRANCH")
            if [ "$DRAFT" != "true" ]; then
              gh pr create --title "$TITLE" "${args[@]}"
            else
              # A draft when the reviewer still wanted changes after the rework round. Private
              # repositories on the free plan have no drafts, so fall back to saying it in the title.
              gh pr create --draft --title "$TITLE" "${args[@]}" ||
                gh pr create --title "[open review findings] $TITLE" "${args[@]}"
            fi
          fi
          echo "url=$(gh pr view "$BRANCH" --json url --jq .url)" >> "$GITHUB_OUTPUT"

  # Tells the ticket how it went: the pull request, the failed gates, or that the run broke.
  report:
    name: 4 Report on the ticket
    needs: [prepare, write, gates, fix, gates-again, review, rework, publish]
    # Also when prepare failed: the ticket should hear that there was no analysis to work from.
    if: ${{ !cancelled() && needs.prepare.result != 'skipped' }}
    runs-on: ubuntu-latest
    environment: TRACKER
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Beherrit/agentic-qa-playwright/.github/actions/setup@v1
        with:
          browser: 'false'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: qa-run
          path: qa-run

      - name: Post the outcome
        if: hashFiles('qa-run/request.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          PR_URL: ${{ needs.publish.outputs.url }}
        run: npx agentic-qa notify tests
