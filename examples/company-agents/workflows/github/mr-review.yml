name: MR review

# Review comments on the diff lines, from the bot, never an approval. Runs when a pull request is marked ready or when
# someone comments "/review" on it. Same three-job shape as mr-describe.yml.

on:
  pull_request:
    types: [ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: mr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

env:
  CO_AGENTS_ENABLED: ${{ vars.CO_AGENTS_ENABLED || 'true' }}
  PR: ${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  fetch:
    # On a comment: only "/review", only on a pull request, only from someone who can write to the repository.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsx examples/company-agents/cli/co.ts mr review $PR --stage fetch --bundle bundle.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_READ_TOKEN }}
      - uses: actions/upload-artifact@v4
        with: { name: bundle, path: bundle.json, retention-days: 1 }

  agent:
    needs: fetch
    runs-on: ubuntu-latest
    environment: agents
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: bundle }
      - run: npx tsx examples/company-agents/cli/co.ts mr review $PR --stage agent --bundle bundle.json --result result.json
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: result, path: result.json, retention-days: 1 }

  post:
    needs: agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: bundle }
      - uses: actions/download-artifact@v4
        with: { name: result }
      - run: npx tsx examples/company-agents/cli/co.ts mr review $PR --stage post --bundle bundle.json --result result.json --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
